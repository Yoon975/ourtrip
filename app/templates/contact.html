{% extends "base.html" %}

{% block title %}문의 — Our Trip{% endblock %}

{% block content %}
<section class="page-hero">
  <div class="container">
    <p class="page-hero__label">CONTACT</p>
    <h1 class="page-hero__title">문의하기<span class="page-hero__num">(1)</span></h1>
    <p class="page-hero__desc">서비스 관련 문의나 제안을 남겨주세요.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <form class="form-paper" method="post" action="{{ url_for('main.contact') }}">
      <div class="form-paper__tape" aria-hidden="true"></div>

      <div class="form-row">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="홍길동" required />
      </div>

      <div class="form-row">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="hello@example.com" required />
      </div>

      <div class="form-row">
        <label for="message">메시지</label>
        <textarea id="message" name="message" rows="6" placeholder="문의 내용을 입력해 주세요." required></textarea>
      </div>

      <button type="submit" class="btn btn--primary">보내기</button>
    </form>
  </div>
</section>
{% endblock %}

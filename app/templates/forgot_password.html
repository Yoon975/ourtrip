{% extends "base.html" %}

{% block title %}비밀번호 찾기 — Our Trip{% endblock %}

{% block content %}
<section class="page-hero page-hero--compact">
  <div class="container">
    <p class="page-hero__label">RESET</p>
    <h1 class="page-hero__title">비밀번호 찾기<span class="page-hero__num">(1)</span></h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <form class="form-paper" method="post" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="form-paper__tape" aria-hidden="true"></div>
      <div class="form-row">
        <label for="email">가입 이메일</label>
        <input type="email" id="email" name="email" placeholder="hello@example.com" required />
      </div>
      <button type="submit" class="btn btn--primary">재설정 링크 받기</button>
      <p class="form-paper__link">
        <a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a>
      </p>
    </form>

    {% if reset_url and dev_link_enabled %}
    <div class="form-paper account-panel" style="margin-top: 1.5rem;">
      <p class="account-panel__meta">개발 환경 안내: 아래 링크로 비밀번호를 재설정할 수 있습니다.</p>
      <p><a href="{{ reset_url }}">{{ reset_url }}</a></p>
    </div>
    {% endif %}
  </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}로그인 — Our Trip{% endblock %}

{% block content %}
<section class="page-hero page-hero--compact">
  <div class="container">
    <p class="page-hero__label">LOGIN</p>
    <h1 class="page-hero__title">로그인<span class="page-hero__num">(1)</span></h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <form class="form-paper" method="post" action="{{ url_for('auth.login') }}">
      <div class="form-paper__tape" aria-hidden="true"></div>

      <div class="form-row">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="hello@example.com" required />
      </div>

      <div class="form-row">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호" required />
      </div>

      <button type="submit" class="btn btn--primary">로그인</button>
      <p class="form-paper__link">
        계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a>
      </p>
    </form>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}비밀번호 재설정 — Our Trip{% endblock %}

{% block content %}
<section class="page-hero page-hero--compact">
  <div class="container">
    <p class="page-hero__label">RESET</p>
    <h1 class="page-hero__title">새 비밀번호 설정<span class="page-hero__num">(1)</span></h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <form class="form-paper" method="post" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="form-paper__tape" aria-hidden="true"></div>
      <div class="form-row">
        <label for="new_password">새 비밀번호</label>
        <input type="password" id="new_password" name="new_password" required />
      </div>
      <div class="form-row">
        <label for="confirm_password">새 비밀번호 확인</label>
        <input type="password" id="confirm_password" name="confirm_password" required />
      </div>
      <button type="submit" class="btn btn--primary">비밀번호 저장</button>
    </form>
  </div>
</section>
{% endblock %}
